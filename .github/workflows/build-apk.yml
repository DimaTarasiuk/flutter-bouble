name: Build APK and Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Пересоздаем файлы платформы без перезаписи pubspec.yaml
      - name: Generate platform files (android)
        run: flutter create --project-name login_app --org com.example --platforms=android .

      - name: Allow cleartext (http, no SSL) traffic — TEMPORARY until backend has HTTPS
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Generate platform files (windows)
        run: flutter create --project-name login_app --org com.example --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Show Flutter/Visual Studio diagnostics
        run: flutter doctor -v

      - name: Build Windows exe
        run: flutter build windows --release

      - name: Zip the build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath login_app-windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: app-release-windows
          path: login_app-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Generate platform files (macos)
        run: flutter create --project-name login_app --org com.example --platforms=macos .

      - name: Allow cleartext (http, no SSL) traffic — TEMPORARY until backend has HTTPS
        run: |
          plutil -replace NSAppTransportSecurity -xml '<dict><key>NSAllowsArbitraryLoads</key><true/></dict>' macos/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Zip the build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../login_app-macos.zip *.app

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: app-release-macos
          path: login_app-macos.zip
