name: Build and Create Release

on:
  push:
    branches: [ main, master ]
  # Спрацьовує автоматично при створенні нового релізу на GitHub
  release:
    types: [ created ]
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate platform files and keep dependencies
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --project-name login_app --org com.example --platforms=android .
          mv pubspec.yaml.bak pubspec.yaml

      - name: Allow cleartext traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Публікація файлу в GitHub Release
      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Generate platform files and keep dependencies
        run: |
          Copy-Item pubspec.yaml pubspec.yaml.bak
          flutter create --project-name login_app --org com.example --platforms=windows .
          Move-Item pubspec.yaml.bak pubspec.yaml -Force

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows exe
        run: flutter build windows --release

      - name: Zip the build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath login_app-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-windows
          path: login_app-windows.zip

      # Публікація файлу в GitHub Release
      - name: Upload Windows zip to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: login_app-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Generate platform files and keep dependencies
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --project-name login_app --org com.example --platforms=macos .
          mv pubspec.yaml.bak pubspec.yaml

      - name: Allow cleartext traffic
        run: |
          plutil -replace NSAppTransportSecurity -xml '<dict><key>NSAllowsArbitraryLoads</key><true/></dict>' macos/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Zip the build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../login_app-macos.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-macos
          path: login_app-macos.zip

      # Публікація файлу в GitHub Release
      - name: Upload macOS zip to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: login_app-macos.zip
