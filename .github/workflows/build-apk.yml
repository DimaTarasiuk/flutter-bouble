name: Build and Update Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

# Даємо дозволи на перезапис релізів
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate platform files and keep dependencies
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --project-name login_app --org com.example --platforms=android .
          mv pubspec.yaml.bak pubspec.yaml

      - name: Allow cleartext traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      # Автоматичне створення / перезапис релізу 'latest'
      - name: Update Latest Release (Android)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Auto-Build"
          body: "Автоматична збірка останньої версії з гілки main."
          files: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Generate platform files and keep dependencies
        run: |
          Copy-Item pubspec.yaml pubspec.yaml.bak
          flutter create --project-name login_app --org com.example --platforms=windows .
          Move-Item pubspec.yaml.bak pubspec.yaml -Force

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows exe
        run: flutter build windows --release

      - name: Zip the build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath login_app-windows.zip

      - name: Update Latest Release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Auto-Build"
          files: login_app-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Generate platform files and keep dependencies
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --project-name login_app --org com.example --platforms=macos .
          mv pubspec.yaml.bak pubspec.yaml

      - name: Allow cleartext traffic
        run: |
          plutil -replace NSAppTransportSecurity -xml '<dict><key>NSAllowsArbitraryLoads</key><true/></dict>' macos/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Zip the build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../login_app-macos.zip *.app

      - name: Update Latest Release (macOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Auto-Build"
          files: login_app-macos.zip
