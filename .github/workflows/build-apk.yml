
name: Build APK and Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Remove any pre-existing platform folders
        run: rm -rf android build

      - name: Generate Android platform files
        run: flutter create --project-name bouble_chat --org com.bouble --platforms=android .

      - name: Add Internet permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Set app display name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Bouble Chat"/' android/app/src/main/AndroidManifest.xml

      - name: Check Android Manifest
        run: |
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml
          echo "===== INTERNET permission ====="
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo "INTERNET permission FOUND"
          else
            echo "INTERNET permission NOT FOUND"
            exit 1
          fi

      - name: Allow cleartext HTTP traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Prepare signing from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets. See signing/README.md"
            exit 1
          fi
          mkdir -p signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing/bouble-upload.jks
          cat > signing/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=bouble-upload.jks
          EOF
          # trim leading spaces from heredoc lines
          sed -i 's/^[[:space:]]*//' signing/key.properties

      - name: Configure stable release signing
        run: |
          chmod +x scripts/ci_configure_android_signing.sh
          scripts/ci_configure_android_signing.sh

      - name: Install dependencies
        run: flutter pub get

      # build-number = GitHub run_number → each CI APK can install over the previous one
      - name: Build APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk bouble-chat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bouble-chat-apk
          path: bouble-chat.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Remove any pre-existing platform folders
        run: |
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

      - name: Generate platform files
        run: flutter create --project-name bouble_chat --org com.bouble --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Show Flutter/Visual Studio diagnostics
        run: flutter doctor -v

      - name: Build Windows exe
        run: flutter build windows --release

      - name: Zip the build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath bouble-chat-windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: bouble-chat-windows
          path: bouble-chat-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Remove any pre-existing platform folders
        run: rm -rf macos build

      - name: Generate platform files
        run: flutter create --project-name bouble_chat --org com.bouble --platforms=macos .

      - name: Set app display name
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Bouble Chat" macos/Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string 'Bouble Chat'" macos/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Bouble Chat" macos/Runner/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Bouble Chat'" macos/Runner/Info.plist
          # Bundle ID comes from: flutter create --org com.bouble --project-name bouble_chat
          # Keep --org/--project-name unchanged so updates can replace the same app.

      - name: Allow cleartext HTTP traffic
        run: |
          plutil -replace NSAppTransportSecurity -xml '<dict><key>NSAllowsArbitraryLoads</key><true/></dict>' macos/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      # Rising build number (like Android versionCode) — newer than previous CI build
      - name: Build macOS app
        run: flutter build macos --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Ad-hoc code sign
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app")
          echo "Signing: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          echo "Bundle ID / versions:"
          defaults read "$APP_PATH/Contents/Info" CFBundleIdentifier || true
          defaults read "$APP_PATH/Contents/Info" CFBundleShortVersionString || true
          defaults read "$APP_PATH/Contents/Info" CFBundleVersion || true

      - name: Package with ditto
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -exec basename {} \;)
          # Stable app folder name inside the zip for easy replace in /Applications
          if [ "$APP_NAME" != "bouble_chat.app" ]; then
            mv "$APP_NAME" bouble_chat.app
            APP_NAME=bouble_chat.app
          fi
          ditto -c -k --keepParent "$APP_NAME" ../../../../../bouble-chat-macos.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: bouble-chat-macos
          path: bouble-chat-macos.zip

  release:
    needs: [android, windows, macos]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download successful build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bouble-chat-*
          path: release-files
          merge-multiple: true

      - name: Check available artifacts
        run: |
          echo "Available release files:"
          ls -lah release-files

          if [ -z "$(ls -A release-files)" ]; then
            echo "No successful builds found. Skipping release."
            exit 1
          fi

      - name: Publish (or update) the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: release-files/*
