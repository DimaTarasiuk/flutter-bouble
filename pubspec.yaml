name: bouble_chat
description: Booblify — Flutter client
publish_to: 'none'
# +N = versionCode. CI overrides with GitHub run_number so each APK can update over the previous.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  shared_preferences: ^2.3.2
  web_socket_channel: ^2.4.5
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  fl_chart: ^0.69.0
  flutter_inset_shadow: ^2.0.3

# CI resolved a newer JNI-based shared_preferences_android that crashes on
# launch (NoSuchMethodError ...SharedPreferencesApiRegistrar.getAll) -> app hangs on loading.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
